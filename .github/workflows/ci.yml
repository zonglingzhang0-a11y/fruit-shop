# 持续集成：每次推送到 main、每个 PR 都跑一遍，保证队友拿到的代码能编译、测试全绿、前端能构建、Python 自检通过。
#
# - backend：H2（默认 profile）跑全套测试
# - backend-mysql：真实 MySQL 8.0 / 8.4 上用 mysql profile 跑全套测试（docs/01「切换到 MySQL 8」的口径）
# - frontend：npm ci + 构建。frontend/.npmrc 与 package-lock.json 指向国内镜像 registry.npmmirror.com，
#   CI 在海外机房，改用官方源（--replace-registry-host 把锁文件里的镜像地址换成官方源，锁定的版本与校验和不变）
# - python：按 requirements.txt 安装固定版本依赖，跑各脚本自带的自检
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（H2）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test

  backend-mysql:
    name: 后端测试（MySQL ${{ matrix.mysql }}）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: fruit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/fruit_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test -Dspring.profiles.active=mysql

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --registry=https://registry.npmjs.org/ --replace-registry-host=registry.npmmirror.com
      - run: npm run build

  python:
    name: Python 自检
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/_pycheck.py
      - run: python scripts/pricing_rule.py --selftest
      - run: python scripts/pricing_model.py --selftest
      - run: python scripts/export_model_suggestions.py --selftest
      - run: python scripts/evaluate_strategies.py --selftest
