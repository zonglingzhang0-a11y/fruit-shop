<text x="32.0" y="850.0" font-size="12.5" fill="#909399" text-anchor="start" font-weight="400">不画成外部实体：供应商（文档里没有这个角色，进货不在范围）；Python 定价脚本（在系统内，即一层图 P4）；定时器（每小时只读扫描，是 P2 的内部动作）。</text>
<text x="32.0" y="872.0" font-size="12.5" fill="#909399" text-anchor="start" font-weight="400">推送只是系统内的站内记录，不接微信/短信；全店群发文案由店主自己转发到微信群。“推送打开回执”在演示中由工作台代为标记。</text></svg>