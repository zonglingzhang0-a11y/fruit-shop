<text x="62.0" y="842.0" font-size="13" fill="#606266" text-anchor="start" font-weight="400">③ 未画：辅助表 shop_traffic_hourly、shop_traffic_profile、strategy_daily_stat、seed_load_log、health_check；逻辑外键 pricing_suggestion.item_id（冗余）、push_task.related_item_id。</text></svg>